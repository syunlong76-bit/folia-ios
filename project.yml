# Folia iOS 套壳工程 —— XcodeGen 工程描述文件
# 使用方式：在仓库根目录执行 `xcodegen generate` 生成 Folia.xcodeproj，
# 再用 Xcode 或 xcodebuild 构建。云端构建见 .github/workflows/build-ipa.yml。
name: Folia
options:
  bundleIdPrefix: com.miller
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Folia:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # (75) Live Activity 共享属性（与扩展同编一份，见 Widgets 注）
      - path: Widgets/FoliaIslandActivity.swift
      # App 图标资产目录（AppIcon.appiconset，1024 满版 PNG）
      - path: Assets.xcassets
      # 原生特效面静态包（M2 剥离版播放页，folder reference，运行时定位 "WebEffect"）
      - path: Resources/WebEffect
        type: folder
      # 主题场景带画作（3.7 (13.4)，莫奈风草地带图，folder reference）
      - path: Resources/ThemeArt
        type: folder
      # 主页墙入场视频（3.7 (16) 挂冷启、(17) 挪到墙进入槽，v5 全油画
      # 入场动画，folder reference，运行时定位 "EntryVideo/entry-v5-faststart.mp4"；
      # 3.7 (54) 工作流 O 起加载 faststart 版：entry-v5-faststart.mp4 为
      # entry-v5.mp4 的流拷贝重排产物（moov 前置、字节数不变、与母带逐流
      # framemd5 一致），原 entry-v5.mp4 仍在同目录但不再被加载；
      # entry-v5-faststart.mp4 首帧提取图 entry-firstframe.jpg 同目录收录）
      - path: Resources/EntryVideo
        type: folder
      # 猫狗贴纸 APNG（3.7 (24)，folder reference，运行时定位
      # "Stickers/<名>.png"，原素材真帧不改帧）
      - path: Resources/Stickers
        type: folder
      # 演唱会抠图版贴纸（3.7 (53) 工作流 J，folder reference，运行时
      # 定位 "StickersCutout/<名>.png"；仅带矩形底素材的真抠图版，
      # 演唱会加载优先于原贴纸）
      - path: Resources/StickersCutout
        type: folder
    info:
      path: Info.plist
      # 注意：XcodeGen 在 generate 时按这里的 properties 重写 Info.plist，
      # 定制键不写在这里就会被生成默认值覆盖（曾因此丢过场景清单、ATS 例外，
      # 且版本号被写成 1.0/1）。下面与仓库 Info.plist 的定制内容保持一致。
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: Folia
        CFBundleShortVersionString: "3.7"
        CFBundleVersion: "87"
        LSRequiresIPhoneOS: true
        UIViewControllerBasedStatusBarAppearance: true
        # (60) 第 1 条：启动屏只留纯黑（LaunchBlack.colorset），
        # 不再垫油画海报图——(59) 规格「点进去可以黑、黑一下后
        # 画面慢慢淡入」：系统启动屏即纯黑第一帧，入场淡入由
        # 应用内 EntryIntro 接管。EntryPoster 资源本体保留，
        # 播放期海报垫底行为不动。注意 iOS 缓存启动屏，验收
        # 须删 App 重装才刷新。
        UILaunchScreen:
          UIColorName: LaunchBlack
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        # (75) 真 Live Activity 总开关（缺此键系统恒不呈现
        # 活动、request 直接失败）。
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miller.folia
        PRODUCT_NAME: Folia
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "3.7"
        CURRENT_PROJECT_VERSION: "52"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # DatabaseManager 用 import SQLite3（系统库，需显式链接）
        OTHER_LDFLAGS: "-lsqlite3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    # (75) 嵌入 Widget 扩展（产物落 PlugIns/FoliaWidgets.appex）
    dependencies:
      - target: FoliaWidgets
        embed: true

  # (75) Widget 扩展：只承载灵动岛宠物 Live Activity。
  # 图片走扩展包内 Assets.xcassets（53 只宠物首帧图），不
  # 用 App Group（DS 对账 A：个人团队/SideStore 重签时自
  # 选 group id 大概率注册失败，v1 渲染又不依赖共享容器）。
  # Info.plist 显式在此配置（DS 对账工程条），generate 后
  # 验包逐项核对 NSExtension 点与版本号。
  FoliaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: FoliaWidgets
        CFBundleShortVersionString: "3.7"
        CFBundleVersion: "87"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miller.folia.widgets
        PRODUCT_NAME: FoliaWidgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
