# Folia iOS 套壳工程 —— XcodeGen 工程描述文件
# 使用方式：在仓库根目录执行 `xcodegen generate` 生成 Folia.xcodeproj，
# 再用 Xcode 或 xcodebuild 构建。云端构建见 .github/workflows/build-ipa.yml。
name: Folia
options:
  bundleIdPrefix: com.miller
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  # zip 解压（UpdateManager 下载前端更新包后解压用）
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

targets:
  Folia:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      # 整个 Web 文件夹以 folder reference（蓝色文件夹）打进 app 包，
      # 保持目录结构，运行时经 Bundle.main 定位 "Web" 文件夹
      - path: Resources/Web
        type: folder
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miller.folia
        PRODUCT_NAME: Folia
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
