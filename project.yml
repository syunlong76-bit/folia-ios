# Folia iOS 套壳工程 —— XcodeGen 工程描述文件
# 使用方式：在仓库根目录执行 `xcodegen generate` 生成 Folia.xcodeproj，
# 再用 Xcode 或 xcodebuild 构建。云端构建见 .github/workflows/build-ipa.yml。
name: Folia
options:
  bundleIdPrefix: com.miller
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # zip 解压（UpdateManager 下载前端更新包后解压用）
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

targets:
  Folia:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # App 图标资产目录（AppIcon.appiconset，1024 满版 PNG）
      - path: Assets.xcassets
      # 整个 Web 文件夹以 folder reference（蓝色文件夹）打进 app 包，
      # 保持目录结构，运行时经 Bundle.main 定位 "Web" 文件夹
      - path: Resources/Web
        type: folder
      # 双壳浏览表面的前端文件（浏览构建，folder reference，运行时定位 "WebBrowse"）
      - path: Resources/WebBrowse
        type: folder
      # 原生特效面静态包（M2 剥离版播放页，folder reference，运行时定位 "WebEffect"）
      - path: Resources/WebEffect
        type: folder
    info:
      path: Info.plist
      # 注意：XcodeGen 在 generate 时按这里的 properties 重写 Info.plist，
      # 定制键不写在这里就会被生成默认值覆盖（曾因此丢过场景清单、ATS 例外，
      # 且版本号被写成 1.0/1）。下面与仓库 Info.plist 的定制内容保持一致。
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: Folia
        CFBundleShortVersionString: "3.1"
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        UIViewControllerBasedStatusBarAppearance: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miller.folia
        PRODUCT_NAME: Folia
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "3.1"
        CURRENT_PROJECT_VERSION: "3"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # DatabaseManager 用 import SQLite3（系统库，需显式链接）
        OTHER_LDFLAGS: "-lsqlite3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
