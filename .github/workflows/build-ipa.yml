name: Build unsigned IPA

# 把本仓库推上 GitHub 后，在 Actions 页手动点 Run workflow，
# 或向 main 分支 push，即产出未签名 IPA（签名在安装时由 SideStore / 开发者账号完成）。

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 3.6 (7) P1 卡点已于 3.7 (67) 退役：WallRegistryPatch 本体
      # 自 3.6 (8) 起停用（isEnabled=false、代码保留备查），其锚点
      # 目标是全量前端包里的 wall chunk；(67) WebEffect 换包为
      # player-visual 纯渲染器后 wall chunk 整体离包，锚点无对
      # 象可命中，检查随之退役（脚本保留在 scripts/ 备查）。

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Folia.xcodeproj -scheme Folia

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Folia.xcodeproj \
            -scheme Folia \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DD/Build/Products/Release-iphoneos/Folia.app"
          test -d "$APP_PATH"
          rm -rf Payload Folia-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Folia-unsigned.ipa Payload
          ls -lh Folia-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folia-unsigned-ipa
          path: Folia-unsigned.ipa
          if-no-files-found: error
