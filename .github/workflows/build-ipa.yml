name: Build unsigned IPA

# 把本仓库推上 GitHub 后，在 Actions 页手动点 Run workflow，
# 或向 main 分支 push，即产出未签名 IPA（签名在安装时由 SideStore / 开发者账号完成）。

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Folia.xcodeproj -scheme Folia

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Folia.xcodeproj \
            -scheme Folia \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DD/Build/Products/Release-iphoneos/Folia.app"
          test -d "$APP_PATH"
          rm -rf Payload Folia-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Folia-unsigned.ipa Payload
          ls -lh Folia-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folia-unsigned-ipa
          path: Folia-unsigned.ipa
          if-no-files-found: error
