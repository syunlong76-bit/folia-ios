<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让布局视口铺满刘海/底部横条区域。缺它时 iOS（PWA 与 WKWebView 壳）
         会把页面排进安全区内、上下留出黑边，且下面 black-translucent 的状态栏样式也不生效。
         桌面浏览器忽略这一项；App 根容器是 fixed inset-0，会跟着视口一起铺满。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="一个动态歌词播放器，支持 AI 主题生成" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Folia" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Folia</title>
    <script src="/runtime-config.js"></script>

    <!-- 首屏加载遮罩：内联样式，随 HTML 首帧一起绘制，不等 index.css 与 JS bundle。
         由 src/utils/appSplash.ts 在 React 挂载后淡出并移除。 -->
    <style>html,body{background-color:#09090b}#app-splash{z-index:2147483000;background-color:#09090b;justify-content:center;align-items:center;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;transition:opacity .32s;display:flex;position:fixed;inset:0}#app-splash.is-hiding{opacity:0;pointer-events:none}#app-splash .app-splash-inner{opacity:0;flex-direction:column;align-items:center;gap:28px;animation:.42s .18s forwards app-splash-in;display:flex}#app-splash .app-splash-blocks{aspect-ratio:250/340;width:clamp(88px,15vw,150px);animation:2.4s linear infinite app-splash-drift;position:relative}#app-splash .app-splash-blocks span{border-radius:clamp(4px,.6vw,6px);animation-duration:2.4s,9.6s;animation-timing-function:cubic-bezier(.65,0,.35,1);animation-iteration-count:infinite;position:absolute}#app-splash .app-splash-blocks .is-top{background-color:#f7c918;width:60%;height:24.71%;animation-name:app-splash-top-slide,app-splash-top-color;top:0;left:40%}#app-splash .app-splash-blocks .is-stem{background-color:#e3342a;width:35.2%;height:45.88%;animation-name:app-splash-stem-slide,app-splash-stem-color;top:0;left:0}#app-splash .app-splash-blocks .is-middle{background-color:#1f5bc6;width:80%;height:23.53%;animation-name:app-splash-middle-slide,app-splash-middle-color;top:49.41%;left:0}#app-splash .app-splash-blocks .is-foot{background-color:#fff;width:35.2%;height:23.53%;animation-name:app-splash-foot-slide,app-splash-foot-color;top:76.47%;left:0}@keyframes app-splash-in{to{opacity:1}}@keyframes app-splash-drift{0%{transform:translate(20%)}to{transform:translate(-20%)}}@keyframes app-splash-top-slide{0%{transform:translate(0)}22%,to{transform:translate(66.67%)}}@keyframes app-splash-top-color{0%{background-color:#f7c918}5.5%{background-color:#1f5bc6}25%{background-color:#1f5bc6}30.5%{background-color:#fff}50%{background-color:#fff}55.5%{background-color:#e3342a}75%{background-color:#e3342a}80.5%,to{background-color:#f7c918}}@keyframes app-splash-stem-slide{0%,25%{transform:translate(0)}47%,to{transform:translate(113.64%)}}@keyframes app-splash-stem-color{0%,6.25%{background-color:#e3342a}11.75%{background-color:#f7c918}31.25%{background-color:#f7c918}36.75%{background-color:#1f5bc6}56.25%{background-color:#1f5bc6}61.75%{background-color:#fff}81.25%{background-color:#fff}86.75%,to{background-color:#e3342a}}@keyframes app-splash-middle-slide{0%,50%{transform:translate(0)}72%,to{transform:translate(50%)}}@keyframes app-splash-middle-color{0%,12.5%{background-color:#1f5bc6}18%{background-color:#fff}37.5%{background-color:#fff}43%{background-color:#e3342a}62.5%{background-color:#e3342a}68%{background-color:#f7c918}87.5%{background-color:#f7c918}93%,to{background-color:#1f5bc6}}@keyframes app-splash-foot-slide{0%,75%{transform:translate(0)}97%,to{transform:translate(113.64%)}}@keyframes app-splash-foot-color{0%,18.75%{background-color:#fff}24.25%{background-color:#e3342a}43.75%{background-color:#e3342a}49.25%{background-color:#f7c918}68.75%{background-color:#f7c918}74.25%{background-color:#1f5bc6}93.75%{background-color:#1f5bc6}99.25%,to{background-color:#fff}}@media (prefers-reduced-motion:reduce){#app-splash .app-splash-inner{opacity:1;animation:none}#app-splash .app-splash-blocks,#app-splash .app-splash-blocks span{animation:none}}</style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-i18next": "https://aistudiocdn.com/react-i18next@^16.3.5",

}
</script>
  <script type="module" crossorigin src="/assets/main-C-h_3Z62.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-DJS5tWln.js">
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-P2Xu9kJm.js">
<link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading Folia">
      <div class="app-splash-inner">
        <div class="app-splash-blocks" aria-hidden="true">
          <span class="is-stem"></span>
          <span class="is-top"></span>
          <span class="is-middle"></span>
          <span class="is-foot"></span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          // 需要透明背景的入口不能盖遮罩：OBS 浏览器源会被直接推流捕获，
          // Electron 的透明播放背景 / 壁纸窗口（main.cjs 传 splash=0）会在桌面上闪一个黑块。
          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            var splash = document.getElementById('app-splash');
            if (splash) {
              splash.remove();
            }
            return;
          }
        } catch (error) {
          // 探测失败时保留遮罩，React 挂载后仍会移除它。
        }
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
